name: iOS ARM64 IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-port]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      MOLTENVK_VERSION: v1.4.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the Vulkan headers and glslc from Homebrew; MoltenVK, the iOS Vulkan, is the dynamic framework of the official
      # MoltenVK-ios.tar that cmake/IOSApp.cmake embeds in the app. No Vulkan SDK installer is needed.
      - name: Install the Vulkan headers and glslc
        run: brew install shaderc vulkan-headers

      - name: Download the dynamic iOS MoltenVK framework
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moltenvk"
          curl -fL "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-ios.tar" -o "$RUNNER_TEMP/moltenvk/MoltenVK-ios.tar"
          tar -xf "$RUNNER_TEMP/moltenvk/MoltenVK-ios.tar" -C "$RUNNER_TEMP/moltenvk"
          echo "VULKAN_SDK_IOS=$RUNNER_TEMP/moltenvk/MoltenVK/MoltenVK" >> "$GITHUB_ENV"

      # find_package(Vulkan) looks inside the iOS SDK for an iOS build: its headers, library and glslc are named outright
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          brew_prefix="$(brew --prefix)"
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/iOS.cmake \
            -DPT_GAMEPLUS=ON \
            -DVulkan_INCLUDE_DIR="$brew_prefix/include" \
            -DVulkan_LIBRARY="$VULKAN_SDK_IOS/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework/MoltenVK" \
            -DVulkan_GLSLC_EXECUTABLE="$brew_prefix/bin/glslc"

      - name: Build unsigned app
        run: |
          cmake --build build-ios --config Release --target pt -- -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build-ios/Release-iphoneos/pt.app"
          test -d "$APP"
          rm -rf Payload pt-ios-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/pt.app
          /usr/bin/zip -qry pt-ios-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pt-ios-unsigned
          path: pt-ios-unsigned.ipa
          if-no-files-found: error

      - name: Upload app for debugging
        uses: actions/upload-artifact@v4
        with:
          name: pt-ios-app
          path: build-ios/Release-iphoneos/pt.app
          if-no-files-found: error
